    <script>
      // Gracefully silence benign development Vite HMR WebSocket closing warnings
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.message || '').includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#F9FAFB] text-slate-800 antialiased selection:bg-[#F2A68D]/30 font-['Plus_Jakarta_Sans',sans-serif]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
